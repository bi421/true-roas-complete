name: TrueROAS CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  lint-readme:
    name: Validate README
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Lint Markdown
        uses: davidans/markdownlint-cli2-action@v16
        with:
          globs: |
            README.md

  check-ascii:
    name: Check for non-ASCII characters
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      - name: Search for non-ASCII characters
        run: |
          # Ensure strictly English/ASCII source code (no Mongolian or other non-ASCII chars)
          ! grep -rnP '[^\x00-\x7f]' src/ *.py

  unit-tests:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python 3.12
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Pytest
        run: |
          pytest src/trueroas/core/test_inference_scipy.py

      - name: Security Scan (Bandit)
        run: |
          pip install bandit
          bandit -r src/ -ll -x tests

      - name: Secrets Scan (TruffleHog)
        uses: trufflesecurity/trufflehog@main
        with:
          base: main

      - name: Test Docker Build
        run: |
          docker build -t trueroas:test .