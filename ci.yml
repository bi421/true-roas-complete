# TrueROAS CI Pipeline - Zero Tolerance Gate
name: Quality Gate

on:
  push:
    branches: [ main, master, production ]
  pull_request:
    branches: [ main, master, production ]

jobs:
  lint:
    name: Zero Tolerance Linting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy bandit pyright
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
      - name: Deep Syntax Check
        run: python scripts/syntax_check.py
      - name: Ruff Lint & Format
        run: ruff check src/ tests/ --exit-non-zero-on-fix
      - name: Mypy Strict Type Check
        run: mypy src/ --strict --ignore-missing-imports
      - name: Bandit Security Scan
        run: bandit -r src/ -f json -o bandit-report.json || exit 1
      - name: Python Bytecode Validation
        run: python -m compileall src/ -q