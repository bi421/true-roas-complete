[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
mypy_path = "src"
files = ["src", "syntax_check.py", "audit_magic_numbers.py", "test_engine_performance.py"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["src"]
pythonpath = ["."]