services:
  api:
    build: .
    ports:
      - "8001:8001"
    env_file: .env
    environment:
      - PYTHONPATH=/app
    depends_on:
      - redis
      - db

  worker:
    build: .
    command: python -m celery -A trueroas.workers.tasks:celery_app worker -Q high,medium,low --loglevel=info
    env_file: .env
    environment:
      - PYTHONPATH=/app
    depends_on:
      - redis
      - db

  db:
    image: postgres:15-alpine
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-trueroas}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB:-trueroas}
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    command: redis-server --requirepass ${REDIS_PASSWORD}
    ports:
      - "6379:6379"

volumes:
  postgres_data: