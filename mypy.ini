[mypy]
python_version = 3.12
ignore_missing_imports = True
explicit_package_bases = True
disallow_untyped_defs = False
warn_return_any = False
no_implicit_optional = False

[mypy-trueroas.core]
ignore_errors = True

[mypy-trueroas.workers.*]
ignore_errors = False

[mypy-trueroas]
ignore_errors = True
