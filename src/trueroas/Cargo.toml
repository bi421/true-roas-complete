[package]
name = "trueroas"
version = "0.1.0"
edition = "2021"
authors = ["TrueROAS Security Engineering"]
description = "Local-first Zero-Knowledge Analytics for Meta & Shopify"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
rusqlite = { version = "0.31.0", features = ["bundled-sqlcipher-vendored"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
zeroize = { version = "1.7", features = ["derive"] }
blake2 = "0.10"
pbkdf2 = "0.12"
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
chrono = "0.4"
anyhow = "1.0"
dirs = "5.0"
getrandom = { version = "0.2", features = ["js"] }
rand = "0.8"
ed25519-dalek = "2.0"
bs58 = "0.5"
base64 = "0.21"

[build-dependencies]
blake2 = "0.10"
hex = "0.4"